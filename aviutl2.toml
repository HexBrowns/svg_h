#:schema ./.aviutl2-cli/aviutl2.schema.json

# 設定ファイルについては https://github.com/sevenc-nanashi/aviutl2-cli を参照してください。
[project]
id = "svg-h-aux2"
name = "svg_h.aux2"
version = "0.8.0"

[artifacts."svg_h.aux2"]
enabled = true
destination = "Plugin/svg_h/svg_h.aux2"

[artifacts."svg_h.aux2".profiles.debug]
build = "cargo build"
source = "target/debug/svg_h.dll"
enabled = true

[artifacts."svg_h.aux2".profiles.release]
build = ["cargo build --release"]
source = "target/release/svg_h.dll"
enabled = true

[artifacts."English.aul2"]
enabled = false
source = "https://raw.githubusercontent.com/aviutl2/aviutl2_community_translation/refs/heads/main/locales/community_en.aul2"
destination = "Language/English.aul2"
profiles = { debug = { enabled = true } }

[artifacts."English.svg_h.aul2"]
source = "./i18n/English.svg_h.aul2"
destination = "Language/English.svg_h.aul2"

# GCMZDrops ハンドラー（.svg / .svgz → SVG_H）。GCMZDrops 自身が読む
[artifacts."svg_h2obj.lua"]
source = "./assets/GCMZScript/svg_h2obj.lua"
destination = "Plugin/GCMZDrops/GCMZScript/svg_h2obj.lua"

[development]
aviutl2_version = "latest"

[release]
prebuild = ["cargo about generate ./about.hbs -o ./release/package.txt"]
package_template = "./release/package.txt"
package_information = "{name} v{version} / SVGファイルを読み込むプラグイン（ストローク拡張フォーク）"

